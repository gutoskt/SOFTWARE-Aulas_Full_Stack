<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Inserir audio</title>
</head>
<body>
    <!--
    AULA DE INSERIR AUDIO:

          >
    -->

    <!-- audio - Cria um elemento de áudio que pode ser reproduzido no navegador
          > Exemplo: <audio controls>
          > source - Especifica a fonte (aonde o áudio está) do áudio e seu tipo
          > controls - Atributo que adiciona controles de reprodução ao áudio, como play, pause e volume
          > loop - Atributo que faz o áudio reiniciar automaticamente quando chega ao final
          > muted - Atributo que silencia o áudio
          > autoplay - Atributo que faz o áudio começar a ser reproduzido automaticamente quando a página é carregada
    -->

    <h1>Trabalhando com Vídeos</h1>

    <video poster ="imagens/thumb.png" controls widt="420" height="340" loop muted>
        <source src="imagens/natureza.mp4" type="video/mp4"> 
    </video>

    <h1>Tag de audio</h1>
    <audio controls autoplay loop muted>
        <source src="imagens/curso.mp3" type="audio/mpeg">
        
    </audio>
    
</body>
</html>
