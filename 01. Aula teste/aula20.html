<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Detail e summary </title>

</head>
<body>
    <!--
    AULA DE INSERIR DETAIL E SUMMARY:

          > detail - Cria um elemento que pode ser expandido ou recolhido para mostrar ou ocultar conteúdo adicional
          > Exemplo: <details>
            > summary - Especifica um resumo ou título para o conteúdo dentro do elemento details
            > O conteúdo dentro do elemento details é oculto por padrão e só é exibido quando o usuário clica no resumo
          >Open - Atributo que pode ser adicionado ao elemento details para que ele seja exibido expandido por padrão
    -->

    <h1>Tag Detail e Summary</h1>
    <details open>
        <summary><strong>Motor 1.6</strong></summary>
        <p>O carro possui um motor super forte e rápido...</p>
    </details><br>

    <details>
        <summary><strong>Conforto</strong></summary>
        <p>Carro de luxo com sensor de ré, cameras e som de qualidade.</p>
    </details><br>

    <details>
        <summary><strong>Preço</strong></summary>
        <p>12x de R$1.000</p>
    </details>
    
    
</body>
</html>
