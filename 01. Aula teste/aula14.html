<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Criando formulários</title>
</head>
<body>
    <!--
    > <form></form> - Cria um formulário
    > <label></label> - Cria um rótulo (descriação do que passar) para o campo de entrada
    > <input> - Cria um campo de entrada de dados
    > <input type="text"> - Cria um campo de texto (aonde vou escrever)

        <label for="pnome">Primeiro Nome</label>
        <input type="text" id="pnome" name="pnome"> 
         > Forma de conctar esse label com o input assossiado
    > <placeholder> - Texto que aparece dentro do campo de entrada, mas não é enviado junto com o formulário

    > <input type="submit"> - Cria um botão de envio do formulário
    > <input type="submit" value="Cadastrar"> - Cria um botão de envio do formulário com um texto - Nome do botão
    -->

    <h1>Formulários</h1>
    <form>
        <label for="pnome">Primeiro Nome</label>
        <input type="text" id="pnome" name="pnome" placeholder="Seu primeiro nome"> <br> <br>
        
        <label for="unome"> Ultimo nome</label>
        <input type="text" id="unome" name="unome" placeholder="Seu ultimo nome"> <br> <br>

        <input type="submit" volue="Cadastrar" nome="cadastrar">

    </form>
</body>
</html>
