<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Inserir vídeo</title>
</head>
<body>
    <!--
    AULA DE INSERIR VIDEO:

          >video - Cria um elemento de vídeo que pode ser reproduzido no navegador
          > Exemplo: <video controls>
            >source - Especifica a fonte (aonde o vídeo está) do vídeo e seu tipo
          > width e height - Atributos que definem a largura e altura do vídeo
          > controls - Atributo que adiciona controles de reprodução ao vídeo, como play, pause e volume
          >Loop - Atributo que faz o vídeo reiniciar automaticamente quando chega ao final
          >Muted - Atributo que silencia o áudio do vídeo
          >Autoplay - Atributo que faz o vídeo começar a ser reproduzido automaticamente quando a página é carregada
          >Poster - Atributo que define uma imagem a ser exibida antes do vídeo ser reproduzido
    -->

    <h1>Trabalhando com Vídeos</h1>

    <video poster ="imagens/thumb.png" controls widt="420" height="340" loop muted>
        <source src="imagens/natureza.mp4" type="video/mp4"> 
    </video>
    
</body>
</html>
