<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Semântica</title>

</head>
<body>
    <!--
    AULA DE SEMÂNTICA:

          > Html semantico - É uma abordagem que utiliza elementos HTML com significado específico para melhorar a estrutura e a compreensão do conteúdo de uma página web
          > Div - É um elemento genérico usado para agrupar outros elementos e aplicar estilos ou scripts, mas não possui significado semântico específico
          > Header - É usado para definir o cabeçalho de uma página ou seção, geralmente contendo títulos, logotipos e navegação (cria umma ideia semantica sobre o conteudo - Tudop é cabeçalho)
          > Article - É usado para definir um conteúdo independente e auto-contido, como um post de blog, artigo de notícias ou comentário
          > Aside - É usado para definir conteúdo relacionado, mas não essencial, como barras laterais, links relacionados ou informações adicionais
          > Footer - É usado para definir o rodapé de uma página ou seção, geralmente contendo informações de copyright, links de contato e outras informações relevantes (traz uma ideia semantica sobre o conteudo - Tudo que é rodapé)
          > Nav - É usado para definir uma seção de navegação, contendo links para outras páginas ou seções do site (traz uma ideia semantica sobre o conteudo - Tudo que é navegação)
    -->

    <!--

        <h1>Cabeçalho do meu site</h1>

        <ul>
            <li>

    <!-- PARTE COM SEMANTICA ADEQUADA -->
    <header>
        <h1>Cabeçalho do meu site</h1>

        <nav>
            <ul>
                <li>Home</li>
                <li>Contatos</li>
                <li>Sobre</li>
            </ul>
        </nav>
            
    </header>

    <div>
        <article>
            <h3>Seja bem-vindo ao meui site</h3>
            <p>Testeprojeto main</p>
        </article>

        <aside>
            curso 100% na prática direto ao ponto
        </aside>
    </div>

    <footer>
        <p>Todos os diretos reservados ao site</p>
    </footer>

</body>
