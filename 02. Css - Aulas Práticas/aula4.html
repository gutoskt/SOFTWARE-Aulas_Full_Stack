<!--
    AULA 4 - Entendendo box model:

        - O que é box model? 
            - É o modelo de caixa que envolve todos os elementos HTML.(criar estilo para essa box)
            - Define como os elementos são exibidos na página.
            - Cada elemento é representado como uma caixa retangular.

        - Margem: 
            - Espaço externo ao redor do elemento.
            - Afeta o espaço entre elementos.

        - Espaçamrento interno (padding):
            - Espaço interno entre o conteúdo do elemento e sua borda.
            - Afeta o espaço dentro do elemento.

        - Borda (border):
            - Linha que envolve o elemento, entre a margem e o padding.
            - Pode ser estilizada com cor, espessura e estilo.
-->
