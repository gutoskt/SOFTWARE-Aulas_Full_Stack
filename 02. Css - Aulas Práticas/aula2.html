<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Meu primeiro site</title>
</head>

<!--
    AULA 2 - Seletores e Classes

    - Quando usar classes? - Quando queremos aplicar o mesmo estilo a vários elementos.

    - Quando usar o ID? - Quando queremos aplicar um estilo único a um elemento específico.

-->
<body>

    <h1 class="primeiro-h1">Bem-vindo ao meu projeto!!</h1>

    <h1 id="titulo">Olá mundo</h1>

    <h1 class="primeiro-h1">Criando mais um titulo do tipo h1</h1>

    <div>
        <h2 class="titulo-h2">Titulo do tipo h2 </h2>
    </div>

    
</body>
</html>
