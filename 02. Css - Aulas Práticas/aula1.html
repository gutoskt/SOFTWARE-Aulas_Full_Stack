<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>Meu primeiro site</title>
</head>

<!--
    AULA 1 - HTML E CSS


    - 3 formas de criar estilos:
        1 - Em linha (Inline.CSS) - Direto no nosso html, ou na tag. (não é uma boa prática)
            - exemplo: <h1 style="color: red; font-size: 14px;">Bem-vindo ao meu projeto!!</h1>

        2 - CSS-Interno: Style - Direto no seu html na tag Style.(não é uma boa prática)
            - Exemplo: 
                <style>
                    h1{
                        color: red;
                    }
                </style> 

        3 - CSS-Externo: Arquivo separado, onde você cria um arquivo .css e linka no seu html.
            - Exemplo: 
                <link rel="stylesheet" href="style.css">
                - rel="stylesheet" - diz que é uma folha de estilo
                - href="style.css" - diz onde está o arquivo de estilo
-->
<body>

    <h1>Bem-vindo ao meu projeto!!</h1>
    
</body>
</html>
